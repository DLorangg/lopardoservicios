version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: lopardo_db
    restart: always
    environment:
      # Configuramos el contenedor con las mismas credenciales de tu DB
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: u172758686_lopardo
      MYSQL_USER: u172758686_lopardoAdm
      MYSQL_PASSWORD: _Lopardix123
    ports:
      - "3306:3306"
    volumes:
      # Persistencia de datos locales
      - db_data:/var/lib/mysql
      # Esto lee tu SQL en el primer arranque y lo importa automáticamente
      - ./u172758686_lopardo.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lopardo_backend
    restart: always
    ports:
      - "8080:80" # Tu API local estará en http://localhost:8080
    volumes:
      # Mapeamos la carpeta backend local al contenedor para ver los cambios en tiempo real
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      # Estas variables son leídas por el getenv() en db.php
      - DB_HOST=db
      - DB_NAME=u172758686_lopardo
      - DB_USER=u172758686_lopardoAdm
      - DB_PASS=_Lopardix123

volumes:
  db_data: